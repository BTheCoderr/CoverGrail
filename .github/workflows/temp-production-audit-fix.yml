name: Temporary production audit fix

on:
  push:
    branches: [fix/remaining-production-audit]

permissions:
  contents: write

jobs:
  audit-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/remaining-production-audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "Apply non-breaking production audit fixes"
            git push origin HEAD:fix/remaining-production-audit
          fi
