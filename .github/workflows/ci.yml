name: CoverGrail CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
      MOCK_GRADE: "true"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit report
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Critical vulnerability gate
        run: npm audit --omit=dev --audit-level=critical

      - name: Regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser E2E and accessibility checks
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function type check
        run: deno check supabase/functions/delete-account/index.ts
