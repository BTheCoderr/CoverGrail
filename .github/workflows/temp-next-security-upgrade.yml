name: Temporary Next security lock refresh

on:
  push:
    branches: [fix/next-security-upgrade]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/next-security-upgrade

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Upgrade patched Next release
        run: npm install --save-exact next@16.3.6 eslint-config-next@16.3.6

      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "Upgrade Next.js security release to 16.3.6"
            git push origin HEAD:fix/next-security-upgrade
          fi
