name: Temporary portfolio test dependency refresh

on:
  push:
    branches: [feat/portfolio-production-polish]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portfolio-production-polish

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned browser test dependencies
        run: npm install -D @playwright/test@1.63.0 @axe-core/playwright@4.13.0

      - name: Commit dependency lock refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "Add Playwright and accessibility test dependencies"
            git push origin HEAD:feat/portfolio-production-polish
          fi
